# UK series -> provider mapping. Every core.yaml key must appear below, either
# with a real provider mapping or `unavailable: true` + `unavailable_reason`.
#
# Corrected 2026-08-11: the `FRED/...` codes originally here were invented
# without checking against the live API and all 404'd (DBnomics has no
# 'FRED' provider -- see indicators/providers/dbnomics.py's module
# docstring). Replaced with OECD short-term-economic-statistics /
# labour-force-survey / financial-market series (dataset family
# DSD_STES/DSD_LFS/DSD_EAR, `<ISO3>...` series codes, consistent across
# gb/de/eu/ie) or direct ONS series, each confirmed live 2026-08-11.
country: gb
series:
  gdp_real:
    provider: oecd
    # Migrated 2026-08-14: missed by the 2026-08-13 OECD migration, which
    # moved the DSD_STES/DSD_LFS/DSD_EAR series but left the QNA ones on
    # the stale DBnomics mirror despite their OECD provider_series_id.
    # Real GDP, chain-linked volume, national currency, quarterly, SA.
    # OECD Quarterly National Accounts. Confirmed live 2026-08-11 against
    # https://api.db.nomics.world/v22/series/OECD/DSD_NAMAIN1@DF_QNA_EXPENDITURE_NATIO_CURR/Q.Y.GBR.S1.S1.B1GQ._Z._Z._Z.XDC.L.N.T0102.
    provider_series_id: OECD/DSD_NAMAIN1@DF_QNA_EXPENDITURE_NATIO_CURR/Q.Y.GBR.S1.S1.B1GQ._Z._Z._Z.XDC.L.N.T0102
    fallback_providers: [ons]
    source_agency: Office for National Statistics
    source_url: https://www.ons.gov.uk/economy/grossdomesticproductgdp
    licence: ogl
    release_schedule: quarterly lag 40d, 07:00 Europe/London
    release_lag_days: 40
    seasonal_adjustment: sa
    revisable: true
    news_topic_tags: [MACROECONOMICS, GLOBAL ECONOMY]
  cpi_headline:
    provider: ons
    # CPI INDEX 00: ALL ITEMS 2015=100 (CDID D7BT, dataset MM23).
    # Confirmed live 2026-08-11 against
    # https://api.ons.gov.uk/v1/data?uri=/economy/inflationandpriceindices/timeseries/d7bt/mm23.
    provider_series_id: economy/inflationandpriceindices/timeseries/d7bt/mm23
    fallback_providers: []
    source_agency: Office for National Statistics
    source_url: https://www.ons.gov.uk/economy/inflationandpriceindices
    licence: ogl
    release_schedule: monthly lag 16d, 07:00 Europe/London
    release_lag_days: 16
    seasonal_adjustment: nsa
    revisable: false
    news_topic_tags: [MACROECONOMICS]
  cpi_core:
    provider: ons
    # `transform_default: level` overrides core.yaml's `yoy`: ONS DKO8 is
    # already an ANNUAL RATE (history ranges -0.1 to 8.2), unlike
    # cpi_headline's D7BT which is a genuine index (48.4 to 142.5) and so
    # keeps the yoy default.
    transform_default: level
    # ONS core CPI excluding energy, food, alcohol & tobacco -- not
    # reliably mirrored on DBnomics/FRED at time of writing; sourced direct
    # from the ONS API instead. CDID DKO8 (dataset MM23), confirmed live
    # 2026-08-10 against https://api.ons.gov.uk/v1/data?uri=/economy/inflationandpriceindices/timeseries/dko8/mm23
    # -- the previously-listed D7G8 was actually "CPI annual rate: food and
    # non-alcoholic beverages", not the ex-energy/food/alcohol/tobacco core
    # measure. provider_series_id is the ONS website's own URI path (see
    # indicators/providers/ons.py's docstring for why the topic segment is
    # needed, not just "<dataset>/<cdid>").
    provider_series_id: economy/inflationandpriceindices/timeseries/dko8/mm23
    fallback_providers: []
    source_agency: Office for National Statistics
    source_url: https://www.ons.gov.uk/economy/inflationandpriceindices
    licence: ogl
    release_schedule: monthly lag 16d, 07:00 Europe/London
    release_lag_days: 16
    seasonal_adjustment: nsa
    revisable: false
    news_topic_tags: [MACROECONOMICS]
  policy_rate:
    provider: boe
    # Bank of England Bank Rate. Confirmed live 2026-08-10 against the BoE
    # IADB CSV endpoint (see indicators/providers/boe.py's docstring).
    provider_series_id: IUMBEDR
    fallback_providers: [dbnomics]
    source_agency: Bank of England
    source_url: https://www.bankofengland.co.uk/boeapps/database
    licence: ogl
    # release_schedule: unknown -- Bank Rate only changes on MPC decision dates (~8/year), not a fixed calendar rule -- see boe.py's docstring on IADB's non-daily update pattern.
    seasonal_adjustment: nsa
    revisable: false
    news_topic_tags: [MACROECONOMICS]
  unemployment_rate:
    provider: oecd
    # Monthly unemployment rate, 15+, SA. OECD infra-annual labour force
    # statistics. Confirmed live 2026-08-11.
    # Migrated 2026-08-13 off DBnomics' OECD mirror (systemically 74-135 days
    # behind) direct to the OECD SDMX API -- see indicators/providers/oecd.py.
    provider_series_id: OECD/DSD_LFS@DF_IALFS_UNE_M/GBR.UNE_LF_M.PT_LF_SUB._Z.Y._T.Y_GE15._Z.M
    fallback_providers: [ons, dbnomics]
    source_agency: Office for National Statistics
    source_url: https://www.ons.gov.uk/employmentandlabourmarket
    licence: ogl
    release_schedule: monthly lag 40d, 07:00 Europe/London
    release_lag_days: 40
    seasonal_adjustment: sa
    revisable: true
    news_topic_tags: [INEQUALITY & LABOUR]
  wages_nominal:
    provider: oecd
    # Earnings index, private sector, quarterly, SA. OECD hourly-earnings
    # dataset. Confirmed live 2026-08-11.
    # Migrated 2026-08-13 off DBnomics' OECD mirror (systemically 74-135 days
    # behind) direct to the OECD SDMX API -- see indicators/providers/oecd.py.
    provider_series_id: OECD/DSD_EAR@DF_HOU_EAR/GBR.EAR.IX.Y._Z.S1D.Q
    fallback_providers: [ons, dbnomics]
    source_agency: Office for National Statistics
    source_url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours
    licence: ogl
    release_schedule: monthly lag 40d, 07:00 Europe/London
    release_lag_days: 40
    seasonal_adjustment: sa
    revisable: true
    news_topic_tags: [INEQUALITY & LABOUR]
  industrial_production:
    provider: oecd
    # Production volume index, industry excl. construction, monthly, SA.
    # OECD short-term economic statistics. Confirmed live 2026-08-11.
    # Migrated 2026-08-13 off DBnomics' OECD mirror (systemically 74-135 days
    # behind) direct to the OECD SDMX API -- see indicators/providers/oecd.py.
    provider_series_id: OECD/DSD_STES@DF_INDSERV/GBR.M.PRVM.IX.BTE.Y._Z._Z.N
    fallback_providers: [ons, dbnomics]
    source_agency: Office for National Statistics
    source_url: https://www.ons.gov.uk/economy/economicoutputandproductivity
    licence: ogl
    release_schedule: monthly lag 40d, 07:00 Europe/London
    release_lag_days: 40
    seasonal_adjustment: sa
    revisable: true
    news_topic_tags: [MACROECONOMICS, GLOBAL ECONOMY]
  retail_sales:
    provider: oecd
    # Retail trade volume index, monthly, calendar+seasonally adjusted.
    # OECD short-term economic statistics. Confirmed live 2026-08-11.
    # Migrated 2026-08-13 off DBnomics' OECD mirror (systemically 74-135 days
    # behind) direct to the OECD SDMX API -- see indicators/providers/oecd.py.
    provider_series_id: OECD/DSD_STES@DF_INDSERV/GBR.M.TOVM.IX.G47.Y._Z._Z.N
    fallback_providers: [ons, dbnomics]
    source_agency: Office for National Statistics
    source_url: https://www.ons.gov.uk/businessindustryandtrade/retailindustry
    licence: ogl
    release_schedule: monthly lag 20d, 07:00 Europe/London
    release_lag_days: 20
    seasonal_adjustment: sa
    revisable: true
    news_topic_tags: [MACROECONOMICS]
  govt_bond_10y:
    provider: oecd
    # Long-term (10y) government bond yield, monthly. OECD financial
    # market statistics. Confirmed live 2026-08-11.
    # Migrated 2026-08-13 off DBnomics' OECD mirror (systemically 74-135 days
    # behind) direct to the OECD SDMX API -- see indicators/providers/oecd.py.
    provider_series_id: OECD/DSD_STES@DF_FINMARK/GBR.M.IRLT.PA._Z._Z._Z._Z.N
    fallback_providers: [boe, dbnomics]
    source_agency: UK Debt Management Office
    source_url: https://www.dmo.gov.uk/
    licence: ogl
    # release_schedule: unknown -- Primary source (OECD monthly financial market stats) has no publicly documented fixed release day.
    seasonal_adjustment: nsa
    revisable: false
    news_topic_tags: [MACROECONOMICS, GLOBAL ECONOMY]
  fx_vs_usd:
    provider: dbnomics
    # US dollars per British pound, business-day. FED H.10 dataset (series
    # code includes a literal '$'). Confirmed live 2026-08-11 against
    # https://api.db.nomics.world/v22/series/FED/H10/RXI%24US_N.B.UK.
    provider_series_id: FED/H10/RXI$US_N.B.UK
    fallback_providers: [stooq]
    source_agency: Federal Reserve Board (H.10)
    source_url: https://www.federalreserve.gov/releases/h10/
    licence: public-domain
    release_schedule: daily, 16:30 America/New_York
    release_lag_days: 0
    seasonal_adjustment: nsa
    revisable: false
    news_topic_tags: [GLOBAL ECONOMY, TRADE & GLOBALISATION]
  house_prices:
    provider: bis
    # BIS Selected residential property prices, real index (2010=100),
    # quarterly. Migrated 2026-08-13 off the DBnomics BIS/WS_SPP mirror
    # (frozen at Q1 2025) direct to the BIS Statistics API, which returns
    # data through Q1 2026 -- see indicators/providers/bis.py.
    provider_series_id: BIS/WS_SPP/Q.GB.R.628
    fallback_providers: [ons, dbnomics]
    source_agency: Bank for International Settlements
    source_url: https://www.bis.org/statistics/pp.htm
    licence: bis-terms
    # release_schedule: unknown -- BIS residential property price releases are irregular/ad hoc, no fixed calendar day published.
    seasonal_adjustment: sa
    revisable: true
    news_topic_tags: [HOUSING & PROPERTY]
  govt_debt_gdp:
    provider: dbnomics
    provider_series_id: IMF/WEO:latest/GBR.GGXWDG_NGDP   # see us.yaml note on IMF WEO code verification
    fallback_providers: []
    source_agency: International Monetary Fund
    source_url: https://www.imf.org/en/Publications/WEO
    licence: imf-terms
    # release_schedule: unknown -- IMF WEO is published twice yearly (Apr/Oct) on dates set per-vintage, not a fixed rule.
    seasonal_adjustment: nsa
    revisable: true
    news_topic_tags: [MACROECONOMICS]
  budget_balance_gdp:
    provider: dbnomics
    provider_series_id: IMF/WEO:latest/GBR.GGXCNL_NGDP
    fallback_providers: []
    source_agency: International Monetary Fund
    source_url: https://www.imf.org/en/Publications/WEO
    licence: imf-terms
    # release_schedule: unknown -- IMF WEO is published twice yearly (Apr/Oct) on dates set per-vintage, not a fixed rule.
    seasonal_adjustment: nsa
    revisable: true
    news_topic_tags: [MACROECONOMICS]
  current_account_gdp:
    provider: dbnomics
    provider_series_id: IMF/WEO:latest/GBR.BCA_NGDPD
    fallback_providers: []
    source_agency: International Monetary Fund
    source_url: https://www.imf.org/en/Publications/WEO
    licence: imf-terms
    # release_schedule: unknown -- IMF WEO is published twice yearly (Apr/Oct) on dates set per-vintage, not a fixed rule.
    seasonal_adjustment: nsa
    revisable: true
    news_topic_tags: [TRADE & GLOBALISATION, GLOBAL ECONOMY]
  consumer_confidence:
    provider: oecd
    # OECD composite consumer confidence indicator, percentage balance,
    # SA. Confirmed live 2026-08-11.
    # Migrated 2026-08-13 off DBnomics' OECD mirror (systemically 74-135 days
    # behind) direct to the OECD SDMX API -- see indicators/providers/oecd.py.
    provider_series_id: OECD/DSD_STES@DF_CS/GBR.M.CCICP.PB._Z.Y._Z._Z.N
    fallback_providers: [dbnomics]
    source_agency: OECD (Consumer Opinion Surveys)
    source_url: https://data-explorer.oecd.org/
    licence: oecd-terms
    # release_schedule: unknown -- OECD's harmonised consumer confidence indicator has no publicly documented fixed release day.
    seasonal_adjustment: sa
    revisable: false
    news_topic_tags: [MACROECONOMICS]
  equity_index:
    provider: oecd
    # OECD share price index, monthly, for the FTSE market. Stooq (the
    # only daily, no-key source) is bot-gated for non-browser clients as
    # of this writing (confirmed live 2026-08-11, see
    # indicators/providers/stooq.py's docstring) -- kept as a fallback in
    # case that changes; the ticker itself remains unverified. Confirmed
    # live 2026-08-11.
    # Migrated 2026-08-13 off DBnomics' OECD mirror (systemically 74-135 days
    # behind) direct to the OECD SDMX API -- see indicators/providers/oecd.py.
    provider_series_id: OECD/DSD_STES@DF_FINMARK/GBR.M.SHARE.IX._Z._Z._Z._Z.N
    fallback_providers: [stooq, dbnomics]
    source_agency: OECD (Financial Market Statistics)
    source_url: https://data-explorer.oecd.org/
    licence: oecd-terms
    # release_schedule: unknown -- OECD's monthly share price index has no publicly documented fixed release day (Stooq, which would be daily, is currently bot-gated -- see stooq.py).
    seasonal_adjustment: nsa
    revisable: false
    news_topic_tags: [GLOBAL ECONOMY]
extras: []   # populated in Phase 4
