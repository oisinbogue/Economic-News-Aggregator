# Central pipeline configuration. All paths are relative to the repo root
# (see pipeline/config.py:resolve_path) so this file works unchanged on a
# laptop checkout and on the GitHub Actions runner.

paths:
  db_file: data/aggregator.db
  feeds_yaml: config/feeds.yaml
  taxonomy_yaml: config/taxonomy.yaml
  countries_yaml: config/countries.yaml
  indicators_db_file: data/indicators.db

run:
  fetch_concurrency: 30
  fetch_timeout_seconds: 15
  # Raised 300 -> 600 on 2026-07-28, alongside the ORDER BY RANDOM() feed
  # ordering in pipeline.fetch. At 300 the budget was exhausted 7s into a
  # 22s run by ~37 of the 221 active feeds, so it -- not fetch failures --
  # was the real ceiling on source diversity after the feed expansion in
  # c3a4860. Note this costs no LLM calls: pipeline.fetch never touches
  # Cerebras, and summarisation is gated separately by max_summaries_per_run.
  # Deliberately NOT raised further, even though 221 feeds x
  # max_articles_per_feed_per_run would allow ~4,400: fetch capacity already
  # outruns summarise throughput (600 x 6 runs/day = 3,600 fetched vs 80 x 6
  # = 480 summarised), and pipeline.summarize selects newest-first
  # (ORDER BY articles.fetched DESC), so anything beyond that throughput
  # isn't a backlog that drains later -- it's articles that get permanently
  # jumped by newer ones and never summarised at all.
  max_articles_per_run: 600
  # Applied per feed, before the shared max_articles_per_run budget above.
  # Without this, a handful of fast-responding high-volume wire feeds can
  # exhaust the whole run's budget before slower feeds are even parsed --
  # process_feed's coroutines race for articles_remaining in whatever order
  # they win the semaphore, so source diversity silently skewed toward
  # "fastest to respond" rather than "most relevant." Downstream clustering's
  # "multiple perspectives" carousel depends on getting takes from different
  # outlets, so no single feed should be able to dominate one run's intake.
  # 20 is generous relative to typical per-feed article volume between runs
  # (6 runs/day) -- it only bites during genuine breaking-news bursts.
  max_articles_per_feed_per_run: 20
  # A run can touch up to 4 throttled LLM stages -- summarize (up to 2
  # calls/article), predictions, curate (1 call), resolve -- sharing one
  # daily request budget from the provider in the llm: block below.
  #
  # Raised 80 -> 200 on 2026-08-26 alongside the Cerebras -> Gemini
  # Flash-Lite migration (see llm: block). Cerebras's free tier was 5
  # req/min, which forced both a 13s/call throttle and this 80/run cap to
  # avoid burning the whole daily token budget on one stage; Flash-Lite's
  # free tier is 30 RPM / 1,500 RPD / 1M TPM, i.e. requests (not tokens) are
  # now the binding constraint. 200/run x 6 runs/day = 1,200 requests/day,
  # leaving ~300/day of the 1,500 RPD budget for predictions + curate +
  # resolve + any translate-path second calls in summarize itself.
  #
  # (History: raised 20 -> 80 on 2026-07-21 after a ~2,400-article backfill
  # on 18 Jul outpaced 20/run (120/day) so badly that nothing cleared
  # summarize/tag/cluster for 3+ days despite every scheduled run
  # succeeding -- a one-off bump to 400 that same day burned through
  # Cerebras's budget and made curate fail with a 429, hence the revert to
  # 80. Same failure mode to watch for here: don't bump this without also
  # checking the other three stages' combined request cost stays under
  # 1,500/day.)
  max_summaries_per_run: 200
  max_predictions_per_run: 10  # pipeline.predictions (extraction) and pipeline.resolve (resolution) both read this
  recovery_check_interval_hours: 24  # brief feature #5: how often an auto-deactivated feed gets one probe retry rather than being permanently dead
  recovery_probes_per_run: 15  # cap on how many inactive feeds get probed in a single run, alongside the active-feed fetch

validate_feeds:
  concurrency: 20
  timeout_seconds: 15

embed:
  # sentence-transformers/all-MiniLM-L6-v2 via fastembed (ONNX Runtime, no
  # torch -- see pipeline/embed.py). 384-dim, CPU-fast enough for the
  # Actions runner. Summary embeddings are computed once and reused by both
  # pipeline.cluster and pipeline.dedup_predictions.
  model: sentence-transformers/all-MiniLM-L6-v2
  max_embeddings_per_run: 200

tag:
  # pipeline.tag now runs spaCy NER (config/countries.yaml) per article to
  # detect the country it's actually about, not just copy the source feed's
  # country -- meaningfully heavier than the plain keyword matching this
  # replaced, so bounded per run like every other costed stage here.
  max_articles_per_run: 300

cluster:
  # Only articles fetched within this window are eligible to join/form a
  # cluster -- keeps union-find from linking unrelated stories that happen
  # to reuse the same recurring headline words months apart.
  window_days: 3
  title_shared_words: 3     # union-find edge: title significant-word overlap >= this -- fallback only, used when an article has no embedding yet
  embedding_cosine_threshold: 0.62  # union-find edge: summary-embedding cosine similarity > this -- see threshold-selection notes in pipeline/cluster.py
  carousel_cap: 5           # brief feature #1: carousel shows up to this many articles per cluster
  chain_window_days: 14         # how far back to look for a "developing story" parent cluster
  chain_cosine_threshold: 0.78  # centroid-to-centroid similarity needed to link a new cluster to an older one as a chain -- deliberately stricter than embedding_cosine_threshold since a false chain is worse than a missed one; see threshold-selection notes in pipeline/cluster.py

curate:
  # Deliberately decoupled from cluster.window_days: that knob exists to stop
  # union-find linking unrelated stories months apart, not to define what
  # counts as "today's news" for curation. A daily top-10 should be drawn
  # from roughly the last day of coverage, not the last 3.
  candidate_window_hours: 24
  # Floor on how many candidates the 24h window must return before curation
  # proceeds on it; below this, _load_candidates re-queries at 48h instead
  # (see pipeline/curate.py) since a too-small pool makes max_per_country/
  # max_per_topic's backfill loop fire constantly and silently ignore the
  # diversity caps.
  min_candidates: 25
  max_candidates: 40  # shortlist size sent to the LLM for top-10 picking, keeps the prompt inside the 8,192-token context
  oversample_count: 20  # ask the LLM to rank this many (not just 10) so the diversity re-pick loop has room to skip over cap-violating picks
  max_per_country: 3   # diversity cap: at most this many of the day's top 10 may share a country tag
  max_per_topic: 3     # diversity cap: at most this many of the day's top 10 may share a dominant topic tag
  repeat_lookback_days: 3  # how many prior days' top 10s to check for already-featured stories (soft dedup signal in the prompt, not a hard exclusion)

llm:
  # Migrated off Cerebras on 2026-08-26: Cerebras force-migrated all
  # personal accounts from a free tier to pay-as-you-go with a $0 starting
  # balance (no warning, no grace period beyond a one-time $5 credit tied
  # to adding a card) -- every call started failing with 402 Payment
  # Required. Picked Gemini over Groq because Groq deprecated the only two
  # models that fit this pipeline's daily token budget
  # (llama-3.3-70b-versatile, llama-3.1-8b-instant) on 2026-08-16, and
  # because pipeline.summarize also does translation (see that module's
  # docstring), which a small 8B model handles worse than Flash-Lite.
  # Gemini AI Studio's free tier has no card requirement and no stated
  # expiry, unlike every other provider surveyed.
  provider: gemini
  # OpenAI-compatible endpoint -- pipeline.llm.call() speaks the OpenAI
  # chat/completions shape, so any provider offering this compatibility
  # layer is a base_url + model swap, nothing else.
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
  # Flash-Lite, not Flash: Pro-series models are paid-only as of April 2026,
  # and Flash-Lite's free-tier limits (30 RPM / 1,500 RPD / 1M TPM) comfortably
  # cover this pipeline's ~726 calls/day. Confirm against /v1beta/models if
  # Google renames/retires this id -- the lineup has moved fast all year
  # (same reason config.yaml's old Cerebras comment had to keep being updated).
  model: gemini-3.1-flash-lite
  # Name of the env var holding the key -- GEMINI_API_KEY is read from the
  # environment (.env locally, GitHub Actions secret in CI) -- never stored
  # here. Keeping the var name in config (not hardcoded in pipeline/llm.py)
  # means a future provider swap doesn't need a code change to pick a
  # different secret.
  api_key_env: GEMINI_API_KEY
  # Free-tier requests/minute -- pipeline.llm throttles to 60/rpm seconds
  # between calls (with a margin) to stay under this across the whole
  # process, the same way the old Cerebras throttle worked.
  rpm: 30

predictions:
  # brief feature #8: how long after a prediction's horizon_date we keep
  # checking the archive for resolving coverage before giving up and marking
  # it 'expired' with no verdict, rather than checking forever.
  resolution_grace_days: 21
  max_candidate_articles: 15  # archive search results shown to the LLM when proposing a verdict, keeps the prompt inside context
  context_window_days: 14  # how far back pipeline.resolve looks for same-country/topic coverage to give the LLM background context, beyond the direct outcome-candidate search
  context_articles_limit: 8  # cap on how many background-context articles are added to the resolve prompt, keeps it inside context
  dedup_cosine_threshold: 0.85  # pipeline.dedup_predictions: claim-embedding similarity above this, for two predictions from articles in the same cluster, collapses the newer one into the older as a duplicate. Higher than cluster.embedding_cosine_threshold because claims are short and specific (who/what/direction/horizon) -- a near-miss here is more likely two genuinely different predictions than two clusters loosely on the same topic

site:
  title: Economic News Aggregator
  base_url: "https://oisinbogue.github.io/Economic-News-Aggregator/"
  output_dir: site        # pipeline.build writes the static site here
  archive_window_days: 2  # clusters within this window (of "today") show on the homepage; older ones only appear in the archive

backup:
  # pipeline.backup_verify: fail (and don't upload) if any tracked table's
  # row count drops by more than this fraction vs. the previous release
  # snapshot. 0.5 is deliberately loose -- this is a corruption/bad-restore
  # tripwire, not a data-quality check, and legitimate churn (e.g.
  # cleanup_live_blogs purging a backlog) shouldn't false-positive.
  max_row_count_drop_fraction: 0.5

maintenance:
  # pipeline.db_maintenance: articles older than this lose raw_text/
  # original_raw_text (summary/tags/cluster/predictions kept) to keep
  # aggregator.db from growing without bound. See that module's docstring
  # for why this is safe against the prediction-resolution workflow.
  prune_text_after_days: 90

indicators:
  # Runtime knobs for the indicators/ package (separate from pipeline/ --
  # see INDICATORS_BRIEF.md §2/§3). Structural config -- country list, core
  # indicator definitions, provider mappings -- lives in config/indicators/,
  # not here, since those are seed files like feeds.yaml/taxonomy.yaml.
  active_countries: [us, gb, ie, eu, de]   # Phase-1 gate; Phase 5+ grows this list
  dbnomics_base_url: https://api.db.nomics.world/v22/
  ecb_base_url: https://data-api.ecb.europa.eu/service/data
  eurostat_base_url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data
  ons_base_url: https://api.ons.gov.uk/v1/data
  boe_base_url: https://www.bankofengland.co.uk/boeapps/iadb/fromshowcolumns.asp
  bis_base_url: https://stats.bis.org/api/v2/data/dataflow
  oecd_base_url: https://sdmx.oecd.org/public/rest/data
  fetch_concurrency: 5
  fetch_timeout_seconds: 20
  # Rate-limit safety (INDICATORS_BRIEF.md §8): per-provider concurrency cap
  # and a polite minimum delay before each request to that provider, on top
  # of indicators/http.py's per-request exponential backoff on 429/5xx.
  # Providers not listed here fall back to indicators/fetch.py's
  # DEFAULT_PROVIDER_CONCURRENCY/DEFAULT_PROVIDER_DELAY. BoE and Stooq are
  # kept deliberately low/slow -- both have shown bot-detection behaviour
  # (see indicators/providers/boe.py and stooq.py's docstrings).
  provider_concurrency:
    dbnomics: 5
    ecb: 3
    eurostat: 3
    ons: 2
    boe: 1
    stooq: 2
    bls: 2
    bis: 2
    # oecd: 1, not the usual 2-3 -- see provider_delay_seconds below, its
    # rate limiting is stricter than every other provider tested here.
    oecd: 1
  provider_delay_seconds:
    dbnomics: 0.2
    ecb: 0.5
    eurostat: 0.5
    ons: 0.5
    boe: 1.0
    stooq: 0.5
    # BLS is deliberately the slowest/lowest-concurrency provider here: its
    # unregistered daily quota is only 25 requests total (see
    # indicators/providers/bls.py), not a per-second rate limit, so the
    # scarce resource is request *count* across the whole day rather than
    # burst speed -- kept low/slow so incremental runs don't eat the quota
    # needlessly even though nothing here throttles the daily total itself
    # (that's handled by _is_due_for_refresh_release_aware()'s ~10-day
    # far-from-release interval keeping BLS series off most runs).
    bls: 1.0
    bis: 0.5
    # OECD's sdmx.oecd.org rate limiting is meaningfully stricter than every
    # other provider tested here -- confirmed live 2026-08-13: a burst of
    # ~15-20 requests a few seconds apart started 429ing, and the block
    # persisted well beyond indicators/http.py's own backoff window (up to
    # ~15s across 4 retries) -- a 6s gap between individual requests still
    # 429'd after that burst, recovering only after roughly a minute of no
    # requests at all. concurrency=1 (serialize, never parallel) and a 3s
    # delay are deliberately conservative given that; a real incremental
    # run touches far fewer OECD series at once than the ~24 hit during
    # this investigation, so this is unlikely to matter in practice except
    # during --backfill, which is expected to run at a leisurely pace
    # anyway (INDICATORS_BRIEF.md §8: idempotent, not time-sensitive).
    oecd: 3.0
    oecd: 0.5
